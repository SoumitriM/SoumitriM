<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 182" width="280" height="182" role="img">
<style>
  .ink { stroke: #1E293B; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .acc { stroke: #2563EB; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .fill-acc { fill: #2563EB; }
  .fill-soft { fill: #93C5FD; }
  .beam { stroke: #93C5FD; stroke-width: 1.6; stroke-dasharray: 3 5; animation: beam 1.2s linear infinite; }
  .head { animation: bob 2.4s ease-in-out infinite; transform-origin: 140px 98px; }
  .armL { animation: typeL 0.42s ease-in-out infinite; transform-origin: 127px 117px; }
  .armR { animation: typeR 0.42s ease-in-out infinite; transform-origin: 153px 117px; }
  .holo { animation: float 3s ease-in-out infinite; }
  @keyframes beam { to { stroke-dashoffset: -16; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes typeL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
  @keyframes typeR { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(0deg); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes pop { 0%,15% { opacity: 0; transform: scale(.6); } 30%,85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
</style>
<rect x="1" y="1" width="278" height="180" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
<g class="holo">
  <g style="animation: spin 6s linear infinite; transform-origin: 140px 46px;">
    <polygon class="acc" points="140.0,21.0 159.5,30.4 164.4,51.6 150.8,68.5 129.2,68.5 115.6,51.6 120.5,30.4" fill="#FFFFFF"/><circle class="acc" cx="140" cy="46" r="7"/><path class="acc" d="M140.0 39.0 L140.0 27.0"/><path class="acc" d="M145.5 41.6 L154.9 34.2"/><path class="acc" d="M146.8 47.6 L158.5 50.2"/><path class="acc" d="M143.0 52.3 L148.2 63.1"/><path class="acc" d="M137.0 52.3 L131.8 63.1"/><path class="acc" d="M133.2 47.6 L121.5 50.2"/><path class="acc" d="M134.5 41.6 L125.1 34.2"/>
  </g>
  <g style="animation: pulse 1.6s ease-in-out infinite;">
    <path class="acc" d="M178 20 h34 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-22 l-8 7 v-7 h-4 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 z" fill="#FFFFFF"/>
    <path class="acc" d="M191 29 q4 -5 8 0 q0 4 -4 5 v3"/><circle cx="195" cy="41" r="1.4" class="fill-acc"/>
  </g></g>

  <path class="beam" d="M114 124 L102 88"/>
  <path class="beam" d="M166 124 L178 88"/>
  <g class="head"><circle class="ink" cx="140" cy="98" r="10" fill="#EFF6FF"/></g>
  <path class="ink" d="M140 108 V116"/>
  <path class="ink" d="M124 119 Q140 112 156 119"/>
  <rect x="108" y="124" width="64" height="34" rx="4" fill="#1E293B"/>
  <circle cx="140" cy="141" r="4" class="fill-soft"/>
  <path d="M92 158 H188 L182 164 H98 Z" fill="#1E293B"/>
  <g class="armL"><path class="ink" d="M127 118 L100 134 L114 159"/><circle cx="114" cy="159" r="2.6" fill="#1E293B"/></g>
  <g class="armR"><path class="ink" d="M153 118 L180 134 L166 159"/><circle cx="166" cy="159" r="2.6" fill="#1E293B"/></g>
  <path class="ink" d="M40 166 H240" stroke-width="2"/>

</svg>
